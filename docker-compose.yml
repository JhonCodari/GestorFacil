services:
  db:
    image: postgres:16
    container_name: gestorfacil_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: gestorfacil_redis
    ports:
      - "6379:6379"
    restart: always
  
  app:
    build: .
    container_name: gestorfacil-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
        
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_USER_PASSWORD: ${SPRING_SECURITY_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  postgres_data:

